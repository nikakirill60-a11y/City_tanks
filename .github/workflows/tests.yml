name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Броня и пробитие
        run: node tests/armor.test.mjs
      - name: Данные танков и прогрессия
        run: node tests/data.test.mjs
      - name: Боевая логика
        run: node tests/battle.test.mjs
      - name: Полная симуляция боя
        run: node tests/sim.test.mjs
      - name: Целостность сайта
        run: node tests/structure.test.mjs
